<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ICL</title>
  <link rel="icon" type="image/png" href="images/JKP.png">
  <script>
    function refreshPage() {
      if (confirm("Are you sure you want to refresh?")) {
        location.reload();
      }
    }
  </script>
  <style>
    body {
      display: flex;
      flex-direction: column;
	  background-color: #070000;
      justify-content: flex-start;
      align-items: flex-start;
      height: 100vh;
      margin: 0;
    }
    header {
      background-color: #070000;
      color: white;
      padding: 5px;
      width: 100%;
      display: flex;
      justify-content: flex-start;
      gap: 5px;
      align-items: center;
    }
    footer {
      background-color:#070000;
      color: white;
      padding:1px;
      width: 100%;
      text-align: center;
	  
    }
    #pdfWrapper {
      position: relative;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      height: calc(100vh - 120px);
      overflow-y: auto;
      width: 100%;
      margin: 0;
    }
    #pdfContainer {
      width: auto;
      margin: 2px;
      padding: 0;
      border: 2px solid #000; /* Add border */
      border-radius: 5px; /* Optional: Rounded corners */
    }
    canvas {
      display: block;
      margin: 0;
      margin-bottom: 2px;
    }
 
 header .buttons-container {
      display: flex;
      justify-content: flex-start;
      gap: 2px;s
      align-items: center;
      width: 100%;
    }
    header input[type="button"] {
      padding: 2px 2px;
      font-size: 14px;
      cursor: pointer;
    }
  </style>
  <script>
    window.onload = function() {
      var message = document.getElementById('message');
      message.style.display = 'block';
      setTimeout(function() {
        message.style.display = 'none';
      }, 30000); // 30000 milliseconds = 30 seconds
    };
  </script>
  <style>
    hr {
      border: none;
      border-top: 2px solid #000;
      margin: 10px 0;
      width: 100%;
    }
  </style>
</head>
<body>
  <header>
    <div class="buttons-container">
      <img src="images/ICL-JAT.png" style="width: 8%;"/>
       <div class="zoom-buttons">
      <a href="books.html"><input type="button" value="Home"></a>
    
      <input type="button" value="Refresh" onclick="refreshPage()"/>
       
        <button id="zoomIn">Zoom In</button>
        <button id="zoomOut">Zoom Out</button>
      </div>
      <div id="message">
        "Wait for a while; the book will be displayed according to its size."
      </div>
    </div>
    
    </header>
   <hr>
  <div id="pdfWrapper">
    <div id="pdfContainer"></div>
  </div>
  <footer>
    <p>Copyright @ ICL
    <script language="javascript" type="text/javascript">
      var today = new Date()
      var year = today.getFullYear()
      document.write(year)
    </script>
    </p>
  </footer>
  <script src="js/pdf.min.js"></script>
  <script>
    var url = 'm/books/modern-cpp-tutorial.pdf'; // URL of your PDF file

    var pdfjsLib = window['pdfjs-dist/build/pdf'];
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'js/pdf.worker.min.js';

    var loadingTask = pdfjsLib.getDocument(url);
    var pdfDoc = null;
    var scale = 1.5; // Initial scale

    function renderPage(page, scale, container) {
      var viewport = page.getViewport({ scale: scale });

      var canvas = document.createElement('canvas');
      var context = canvas.getContext('2d');
      canvas.height = viewport.height;
      canvas.width = viewport.width;

      var renderContext = {
        canvasContext: context,
        viewport: viewport
      };

      var renderTask = page.render(renderContext);
      renderTask.promise.then(function () {
        console.log('Page rendered');
      });

      container.appendChild(canvas);
    }

    function renderPDF(pdfDoc, scale) {
      var container = document.getElementById('pdfContainer');
      container.innerHTML = ''; // Clear container before rendering
      for (var pageNum = 1; pageNum <= pdfDoc.numPages; pageNum++) {
        pdfDoc.getPage(pageNum).then(function(page) {
          renderPage(page, scale, container);
        });
      }
    }

    loadingTask.promise.then(function(pdf) {
      pdfDoc = pdf;
      renderPDF(pdfDoc, scale);
    }, function (reason) {
      console.error(reason);
    });

    document.getElementById('zoomIn').addEventListener('click', function() {
      scale += 0.5;
      renderPDF(pdfDoc, scale);
    });

    document.getElementById('zoomOut').addEventListener('click', function() {
      scale = Math.max(0.5, scale - 0.5); // Prevent scale from going below 0.5
      renderPDF(pdfDoc, scale);
    });
  </script>
</body>
</html>
