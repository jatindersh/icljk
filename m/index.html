    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            color: white;

        }
        /* Header Styling */
        header {
            background-color: black;
            padding: 15px 20px;
            box-shadow: 0 2px 5px rgba(255, 255, 255, 0.1); /* Subtle shadow for white text */
            position: sticky;
            top: 0;
            z-index: 1000;
            text-align: center;
        }
        header h1 {
            margin: 0;
            font-size: 20px;
            color: white;
			border-radius: 10px 30px;
	    	border: 2px solid #Ffff00;
            margin: 0;
            padding: 5px;
            width: auto;
			justify-content: center; /* Center horizontally */
            align-items: center;    /* Center vertically */
            text-align: center; 
             background-color: black;
			display: inline-block;
        }
        .menu {
            list-style-type: none;
            padding: 0;
            margin: 10px 0;
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
        }
        .menu li {
            margin: 5px 10px;
        }
        .menu .button {
            display: inline-block;
            background-color: black;
			border-radius: 10px 50px;
            color: white;
            font-weight: bold;
            padding: 10px 20px;
            border: 2px solid white;
            text-align: center;
            text-decoration: none;
            transition: 0.3s ease-in-out;
        }
        .menu .button:hover {
            background-color: white;
            color: black;
        }
        /* Main Content */
        main {
            padding: 20px;
            text-align: center;
        }
        main h2 {
            color: white;
        }
        /* Footer Styling */
        footer {
            background-color: black;
            color: white;
            text-align: center;
            padding: 10px;
            position: relative;
            bottom: 0;
            width: 100%;
        }
        /* Responsive Design */
        @media (max-width: 600px) {
            .menu {
                flex-direction: column;
                align-items: center;
            }
            .menu li {
                margin: 10px 0;
            }
            header h1 {
                font-size: 18px;
            }
            main {
                padding: 15px;
            }
        }
    </style>
   <style>
        ul {
            border-radius:10px 40px;
	    	border: 0px solid #Ffff00;
            margin: 0;
            padding: 0;
            width: 200;
			background-color: gray;
			justify-content: center; /* Center horizontally */

            text-align: center; 
             background-color: black;
			display: inline-block;
        }
        li {

            padding: 14px 16px;
            text-decoration: none;

        li a:hover {

        .submenu {

            background-color: #444;

    <script>
        function toggleMenu(id) {
            var submenu = document.getElementById(id);
            if (submenu.style.display === "block") {
                submenu.style.display = "none";
            } else {
                submenu.style.display = "block";
            }
        }
    </script>
   
</head>
