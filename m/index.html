<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ICL Computer Education</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            color: white;
            background-color: black;
        }
        /* Header Styling */
        header {
            background-color: black;
            padding: 15px 20px;
            box-shadow: 0 2px 5px rgba(255, 255, 255, 0.1); /* Subtle shadow for white text */
            position: sticky;
            top: 0;
            z-index: 1000;
            text-align: center;
        }
        header h1 {
            margin: 0;
            font-size: 20px;
            color: white;
        }
        .menu {
            list-style-type: none;
            padding: 0;
            margin: 10px 0;
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
        }
        .menu li {
            margin: 5px 10px;
        }
        .menu .button {
            display: inline-block;
            background-color: black;
			border-radius: 10px 50px;
            color: white;
            font-weight: bold;
            padding: 10px 20px;
            border: 2px solid white;
            text-align: center;
            text-decoration: none;
            transition: 0.3s ease-in-out;
        }
        .menu .button:hover {
            background-color: white;
            color: black;
        }
        /* Main Content */
        main {
            padding: 20px;
            text-align: center;
        }
        main h2 {
            color: white;
        }
        /* Footer Styling */
        footer {
            background-color: black;
            color: white;
            text-align: center;
            padding: 10px;
            position: relative;
            bottom: 0;
            width: 100%;
        }
        /* Responsive Design */
        @media (max-width: 600px) {
            .menu {
                flex-direction: column;
                align-items: center;
            }
            .menu li {
                margin: 10px 0;
            }
            header h1 {
                font-size: 18px;
            }
            main {
                padding: 15px;
            }
        }
    </style>
    <style>
	

.myButton {
	box-shadow:inset 0px 1px 0px 0px black;
	background:linear-gradient(to bottom, #63b8ee 5%, #468ccf 100%);
	background-color:black;
	border-radius: 10px 50px;
	border:1px solid red;
	display:inline-block;
	cursor:pointer;
	color:white;
	font-family:Arial;
	font-size:15px;
	font-weight:bold;
	padding:6px 24px;
	text-decoration:none;
	text-shadow:0px 1px 0px #7cacde;
}
.myButton:hover {
	background:linear-gradient(to bottom, #468ccf 5%, #63b8ee 100%);
	background-color:#468ccf;
}
.myButton:active {
	position:relative;
	top:1px;
}</style>
</head>
<body>
    <header><img src="images/ICL-JAT.png" alt="">
        <h1>Computer Education</h1>
        <a href="#" class="myButton">Home</a>
        <ul class="menu">
            <li><a href="#home" class="button">Home</a></li>
            <li><a href="#courses" class="button">Courses</a></li>
            <li><a href="#about" class="button">About</a></li>
            <li><a href="#contact" class="button">Contact</a></li>
        </ul>
    </header>
    <main>
        <h2>Welcome to ICL Computer Education</h2>
        <p>Your destination for quality computer education. Learn from the best and shape your future in the digital world.</p>
    </main>
    <footer>
        &copy; 2025 ICL Computer Education. All rights reserved.
    </footer>
</body>
</html>
